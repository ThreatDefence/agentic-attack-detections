[Shared behaviors - Attack Agent Write Test on a Container Registry]
description = Detects an image pushed to a container registry under a repository named after an attack agent or a write test: artex-i<issue id>, hermes-h<id>-writecheck, csai-push-probe, xalgorix-pwn, the gh0st/ and fsociety/ namespaces, or names that hold writecheck, push-probe or pwned. Agents that find a registry open to pushes prove it by pushing a small image, and they name it after themselves. Open registries on the internet carry these names by the hundred. A push can be followed by a poisoned copy of one of your own images, so check what else that source pushed. Sigma rule behaviors/sigma/web/web_container_registry_agent_write_test.yml, id 5d869fd4-60e2-5f21-a676-2ddb7b511c66.
