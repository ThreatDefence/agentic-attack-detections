[Indicators - Reported addresses]
description = Traffic, web requests, sign-ins and CloudTrail calls to or from an address reported for an agentic attack framework. Uses the indicator lookups built from iocs/indicators.csv.
search = `aad_network` \
| eval aad_value=mvdedup(mvappend(src, src_ip, dest, dest_ip, clientip, c_ip, sourceIPAddress, ipAddress, IPAddress, callerIpAddress)) \
| mvexpand aad_value \
| where match(aad_value, "^[0-9a-fA-F:.]+$") \
| lookup aad_ioc_ip match AS aad_value OUTPUT value AS indicator type AS indicator_type confidence framework actor source review_by \
| where isnotnull(indicator) \
| eval i=mvrange(0, mvcount(indicator)) \
| mvexpand i \
| eval indicator=mvindex(indicator, i), indicator_type=mvindex(indicator_type, i), confidence=mvindex(confidence, i), framework=mvindex(framework, i), actor=mvindex(actor, i), source=mvindex(source, i), review_by=mvindex(review_by, i) \
| `aad_active_indicator` \
| eval aad_framework=split(framework, " ") \
| eval aad_entity=aad_value \
| stats count min(_time) AS first_seen max(_time) AS last_seen values(sourcetype) AS sourcetypes values(host) AS hosts BY aad_entity aad_value indicator indicator_type confidence aad_framework actor source \
| eval _time=last_seen, aad_rule="Indicators - Reported addresses" \
| convert ctime(first_seen) ctime(last_seen)
